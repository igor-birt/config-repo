server:
  port: 0

spring:
  application:
    name: product

  mvc:
    problemdetails:
      enabled: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 300
            readTimeout: 400

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:
      downstream:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 4
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 1
        recordExceptions:
          - java.lang.Exception
  timelimiter:
    instances:
      downstream:
        timeoutDuration: 350ms