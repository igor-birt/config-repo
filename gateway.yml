server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
      routes:
        - id: product-route
          uri: lb://product
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1
        - id: catalog-route
          uri: lb://catalog
          predicates:
            - Path=/api/catalog/**
          filters:
            - StripPrefix=1
        - id: inventory-route
          uri: lb://inventory
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,gateway