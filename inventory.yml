server:
  port: 0

spring:
  application:
    name: inventory

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  inventory:
    classpath: "/jcpenney_com_ecommerce_sample.csv"
    maxRows: 20000
    delayMs:
      min: 100
      max: 800